name: XParty v24 Android native port (Gradle APK)
on:
  push:
    branches: [build/android-native-v24-20261101]
    paths:
      - 'native-android/**'
      - '.github/workflows/xparty-native-v24-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: XParty-v24-Native-Android-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
