name: XParty Native Android APK (Gradle + SDK)
on:
  push:
    branches: [build/android-native-preview-20261101]
    paths:
      - 'native-android/**'
      - '.github/workflows/xparty-native-preview-apk.yml'
  pull_request:
    paths:
      - 'native-android/**'
      - '.github/workflows/xparty-native-preview-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36 and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XParty-Android-Native-Preview-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
