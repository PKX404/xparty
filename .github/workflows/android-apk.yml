name: Build Xparty APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk "$HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; listing Android SDK"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f 2>/dev/null | head -200
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Create signing key
        run: |
          KEY_PASS="xparty-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/xparty-release.jks" -alias xparty -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=Xparty, OU=PKX404, O=PKX404, L=NA, ST=NA, C=IN"
          echo "XPARTY_KEYSTORE=$RUNNER_TEMP/xparty-release.jks" >> "$GITHUB_ENV"
          echo "XPARTY_STORE_PASS=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: |
          export XPARTY_ANDROID_SDK="$ANDROID_SDK_ROOT"
          chmod +x android/build-apk.sh
          android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Xparty-1.1.0
          path: android/build/Xparty-1.1.0.apk
          if-no-files-found: error
